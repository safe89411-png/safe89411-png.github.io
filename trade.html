<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بوت الذهب</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>

body{
background:#1828ff;
font-family:sans-serif;
color:white;
text-align:center;
margin:0;
}

.box{
background:#1f2b45;
margin:20px;
padding:20px;
border-radius:25px;
}

.signal{
font-size:55px;
font-weight:bold;
background:black;
padding:30px;
border-radius:25px;
margin-bottom:20px;
}

.buy{
color:#00ff66;
}

.sell{
color:#ff3b3b;
}

.hold{
color:gold;
}

.stats{
font-size:24px;
margin-top:15px;
line-height:45px;
}

</style>
</head>

<body>

<div class="box">

<h1>🤖 بوت الذهب الحقيقي</h1>

<div id="signal" class="signal hold">
HOLD
</div>

<div class="stats">

<div>💰 الربح: <span id="profit">0</span>$</div>

<div>❌ الخسارة: <span id="loss">0</span>$</div>

<div>✅ الصفقات الناجحة: <span id="wins">0</span></div>

<div>❌ الصفقات الخاسرة: <span id="losses">0</span></div>

<div>📈 السعر الحالي: <span id="price">0</span></div>

</div>

</div>

<div id="tvchart"></div>

<script>

new TradingView.widget({
  "width":"100%",
  "height":600,
  "symbol":"OANDA:XAUUSD",
  "interval":"5",
  "timezone":"Asia/Baghdad",
  "theme":"dark",
  "style":"1",
  "locale":"ar",
  "container_id":"tvchart"
});

let position = null;
let entry = 0;

let totalProfit = 0;
let totalLoss = 0;

let wins = 0;
let losses = 0;

const TP = 0.5;
const SL = 0.5;

async function bot(){

try{

const res = await fetch(
"https://api.binance.com/api/v3/depth?symbol=PAXGUSDT&limit=50"
);

const data = await res.json();

const bids = data.bids;
const asks = data.asks;

const buyQty = parseFloat(bids[0][1]);
const sellQty = parseFloat(asks[0][1]);

const priceRes = await fetch(
"https://api.binance.com/api/v3/ticker/price?symbol=PAXGUSDT"
);

const priceData = await priceRes.json();

const gold = parseFloat(priceData.price);

document.getElementById("price").innerText =
gold.toFixed(2);

const signal = document.getElementById("signal");

if(position === null){

if(buyQty > sellQty){

position = "BUY";

entry = gold;

signal.innerHTML = "🟢 BUY";

signal.className = "signal buy";

}

else if(sellQty > buyQty){

position = "SELL";

entry = gold;

signal.innerHTML = "🔴 SELL";

signal.className = "signal sell";

}

}

else if(position === "BUY"){

let floating = gold - entry;

if(floating >= TP){

totalProfit += floating;

wins++;

position = null;

}

else if(floating <= -SL){

totalLoss += Math.abs(floating);

losses++;

position = null;

}

}

else if(position === "SELL"){

let floating = entry - gold;

if(floating >= TP){

totalProfit += floating;

wins++;

position = null;

}

else if(floating <= -SL){

totalLoss += Math.abs(floating);

losses++;

position = null;

}

}

document.getElementById("profit").innerText =
totalProfit.toFixed(2);

document.getElementById("loss").innerText =
totalLoss.toFixed(2);

document.getElementById("wins").innerText =
wins;

document.getElementById("losses").innerText =
losses;

}catch(e){

console.log(e);

}

}

setInterval(bot,2000);

</script>

</body>
</html>
