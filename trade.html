<!DOCTYPE html>
<html lang="ar">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بوت الذهب الحقيقي</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>

body{
margin:0;
font-family:tahoma;
background:#1733ff;
color:white;
text-align:center;
}

.title{
font-size:40px;
padding:20px;
font-weight:bold;
}

.box{
background:#1e2b45;
margin:20px;
padding:20px;
border-radius:30px;
}

.signal{
font-size:70px;
font-weight:bold;
padding:25px;
border-radius:25px;
background:black;
margin-bottom:20px;
}

.buy{
color:#00ff66;
}

.sell{
color:red;
}

.stats{
font-size:28px;
line-height:50px;
}

#ad{
background:white;
color:black;
padding:40px;
margin:20px;
border-radius:20px;
font-size:35px;
}

</style>
</head>

<body>

<div class="title">
🤖 بوت الذهب XAUUSD
</div>

<div class="box">

<div id="signal" class="signal buy">
BUY
</div>

<div class="stats">

<div>
🥇 السعر :
<span id="price">0</span>
</div>

<div>
📥 الدخول :
<span id="entry">0</span>
</div>

<div>
🎯 TP :
<span id="tp">0</span>
</div>

<div>
🛑 SL :
<span id="sl">0</span>
</div>

<div>
💰 الربح :
<span id="profit">0</span>$
</div>

<div>
❌ الخسارة :
<span id="loss">0</span>$
</div>

<div>
✅ الفوز :
<span id="wins">0</span>
</div>

<div>
❌ الخسائر :
<span id="losses">0</span>
</div>

</div>

</div>

<div id="tvchart"></div>

<div id="ad">
💵 مساحة إعلانية
</div>

<script>

new TradingView.widget({
"container_id":"tvchart",
"width":"100%",
"height":500,
"symbol":"OANDA:XAUUSD",
"interval":"5",
"timezone":"Etc/UTC",
"theme":"dark",
"style":"1",
"locale":"ar",
"toolbar_bg":"#000000",
"enable_publishing":false
});

let position = null;
let entry = 0;

let TP = 0.5;
let SL = 0.5;

let profit = 0;
let loss = 0;

let wins = 0;
let losses = 0;

async function getGold(){

try{

let r =
await fetch(
"https://api.gold-api.com/price/XAU"
);

let d = await r.json();

return parseFloat(d.price);

}catch{

return 3300;

}

}

async function getBook(){

try{

let r =
await fetch(
"https://api.binance.com/api/v3/depth?symbol=PAXGUSDT&limit=50"
);

return await r.json();

}catch{

return null;

}

}

async function bot(){

let gold =
await getGold();

document.getElementById("price")
.innerHTML = gold.toFixed(2);

let book =
await getBook();

if(!book) return;

let bids = book.bids;
let asks = book.asks;

let bigBuy =
bids.reduce((a,b)=>
parseFloat(a[1]) >
parseFloat(b[1]) ? a : b
);

let bigSell =
asks.reduce((a,b)=>
parseFloat(a[1]) >
parseFloat(b[1]) ? a : b
);

let buyQty =
parseFloat(bigBuy[1]);

let sellQty =
parseFloat(bigSell[1]);

let signal =
document.getElementById("signal");

if(position == null){

if(buyQty > sellQty){

position = "BUY";

entry = gold;

signal.innerHTML = "BUY 🟢";

signal.className =
"signal buy";

}else{

position = "SELL";

entry = gold;

signal.innerHTML = "SELL 🔴";

signal.className =
"signal sell";

}

document.getElementById("entry")
.innerHTML = entry.toFixed(2);

if(position == "BUY"){

document.getElementById("tp")
.innerHTML =
(entry + TP).toFixed(2);

document.getElementById("sl")
.innerHTML =
(entry - SL).toFixed(2);

}else{

document.getElementById("tp")
.innerHTML =
(entry - TP).toFixed(2);

document.getElementById("sl")
.innerHTML =
(entry + SL).toFixed(2);

}

}else{

if(position == "BUY"){

let floating =
gold - entry;

if(gold >= entry + TP){

profit += floating;

wins++;

position = null;

}

if(gold <= entry - SL){

loss += Math.abs(floating);

losses++;

position = null;

}

}else{

let floating =
entry - gold;

if(gold <= entry - TP){

profit += floating;

wins++;

position = null;

}

if(gold >= entry + SL){

loss += Math.abs(floating);

losses++;

position = null;

}

}

}

document.getElementById("profit")
.innerHTML = profit.toFixed(2);

document.getElementById("loss")
.innerHTML = loss.toFixed(2);

document.getElementById("wins")
.innerHTML = wins;

document.getElementById("losses")
.innerHTML = losses;

}

bot();

setInterval(bot,2000);

</script>

</body>
</html>
