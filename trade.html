<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بوت الذهب الحقيقي</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>

body{
background:#1f33ff;
font-family:Arial;
margin:0;
color:white;
text-align:center;
}

.box{
background:#1b2338;
margin:20px;
padding:20px;
border-radius:25px;
}

button{
padding:15px 30px;
font-size:22px;
border:none;
border-radius:15px;
margin:10px;
color:white;
}

.start{
background:#00b140;
}

.stop{
background:red;
}

.signal{
font-size:55px;
font-weight:bold;
margin-top:20px;
}

.stats{
font-size:24px;
margin-top:15px;
line-height:45px;
}

#tvchart{
height:500px;
margin-top:20px;
border-radius:20px;
overflow:hidden;
}

</style>
</head>

<body>

<h1>🤖 بوت الذهب الحقيقي XAUUSD</h1>

<div class="box">

<button class="start" onclick="startBot()">
تشغيل البوت
</button>

<button class="stop" onclick="stopBot()">
إيقاف البوت
</button>

<div id="signal" class="signal">
OFF
</div>

<div class="stats">

<div>
💰 الربح:
<span id="profit">0</span>$
</div>

<div>
❌ الخسارة:
<span id="loss">0</span>$
</div>

<div>
✅ الفوز:
<span id="wins">0</span>
</div>

<div>
❌ الخسائر:
<span id="losses">0</span>
</div>

</div>

<div id="tvchart"></div>

</div>

<script>

new TradingView.widget({
"width":"100%",
"height":500,
"symbol":"OANDA:XAUUSD",
"interval":"5",
"timezone":"Asia/Baghdad",
"theme":"dark",
"style":"1",
"locale":"ar",
"toolbar_bg":"#000",
"container_id":"tvchart"
});

let botRunning=false;

let position=null;

let entry=0;

let profit=0;
let loss=0;

let wins=0;
let losses=0;

let TP=0.5;
let SL=0.5;

async function getPrice(){

let r = await fetch(
"https://api.binance.com/api/v3/ticker/price?symbol=PAXGUSDT"
);

let d = await r.json();

return parseFloat(d.price);

}

async function getDepth(){

let r = await fetch(
"https://api.binance.com/api/v3/depth?symbol=PAXGUSDT&limit=50"
);

return await r.json();

}

async function botLoop(){

if(!botRunning) return;

try{

let price = await getPrice();

let depth = await getDepth();

let bids = depth.bids;
let asks = depth.asks;

let bigBuy = bids.reduce((a,b)=>
parseFloat(a[1]) > parseFloat(b[1]) ? a : b
);

let bigSell = asks.reduce((a,b)=>
parseFloat(a[1]) > parseFloat(b[1]) ? a : b
);

let buyQty = parseFloat(bigBuy[1]);
let sellQty = parseFloat(bigSell[1]);

if(position==null){

if(buyQty > sellQty){

position="BUY";
entry=price;

document.getElementById("signal").innerHTML=
"🟢 BUY<br>"+price;

}

else if(sellQty > buyQty){

position="SELL";
entry=price;

document.getElementById("signal").innerHTML=
"🔴 SELL<br>"+price;

}

}

else if(position=="BUY"){

let floating = price-entry;

if(price >= entry+TP){

profit += floating;
wins++;

position=null;

document.getElementById("signal").innerHTML=
"💰 BUY TP";

}

else if(price <= entry-SL){

loss += Math.abs(floating);
losses++;

position=null;

document.getElementById("signal").innerHTML=
"❌ BUY SL";

}

}

else if(position=="SELL"){

let floating = entry-price;

if(price <= entry-TP){

profit += floating;
wins++;

position=null;

document.getElementById("signal").innerHTML=
"💰 SELL TP";

}

else if(price >= entry+SL){

loss += Math.abs(floating);
losses++;

position=null;

document.getElementById("signal").innerHTML=
"❌ SELL SL";

}

}

document.getElementById("profit").innerHTML=
profit.toFixed(2);

document.getElementById("loss").innerHTML=
loss.toFixed(2);

document.getElementById("wins").innerHTML=
wins;

document.getElementById("losses").innerHTML=
losses;

}catch(e){

console.log(e);

}

setTimeout(botLoop,2000);

}

function startBot(){

if(botRunning) return;

botRunning=true;

document.getElementById("signal").innerHTML=
"🔥 BOT STARTED";

botLoop();

}

function stopBot(){

botRunning=false;

document.getElementById("signal").innerHTML=
"⛔ BOT STOPPED";

}

</script>

</body>
</html>
