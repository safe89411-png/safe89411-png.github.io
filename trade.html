<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MG TRADE</title>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
margin:0;
padding:0;
text-align:center;
}

header{
background:#111827;
padding:20px;
font-size:35px;
font-weight:bold;
box-shadow:0 0 20px #00ff99;
}

.box{
background:#111827;
margin:20px;
padding:20px;
border-radius:20px;
font-size:28px;
}

button{
padding:18px 35px;
font-size:25px;
border:none;
border-radius:20px;
margin:10px;
font-weight:bold;
cursor:pointer;
}

.buy{
background:#00ff99;
color:black;
}

.sell{
background:red;
color:white;
}

.close{
background:gold;
color:black;
}

iframe{
margin-top:20px;
border:none;
width:100%;
height:500px;
}

</style>
</head>

<body>

<header>
💹 MG TRADE
</header>

<div class="box">
💰 الرصيد:
<span id="balance">1000</span>$
</div>

<div class="box">
📈 السعر:
<span id="price">...</span>
</div>

<div class="box">
📊 الصفقة:
<span id="trade">لا يوجد</span>
</div>

<div class="box">
💵 الربح والخسارة:
<span id="profit">0</span>$
</div>

<button class="buy" onclick="buyTrade()">
BUY
</button>

<button class="sell" onclick="sellTrade()">
SELL
</button>

<button class="close" onclick="closeTrade()">
CLOSE
</button>

<iframe
src="https://s.tradingview.com/widgetembed/?frameElementId=tradingview&symbol=BINANCE:BTCUSDT&interval=1&theme=dark">
</iframe>

<script>

let balance = 1000;

let position = null;

let entry = 0;

let current = 0;

let profit = 0;

async function price(){

try{

let res = await fetch(
"https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT"
);

let data = await res.json();

current = parseFloat(data.price);

document.getElementById("price").innerHTML =
current.toFixed(2);

if(position=="BUY"){

profit = current - entry;

}

if(position=="SELL"){

profit = entry - current;

}

document.getElementById("profit").innerHTML =
profit.toFixed(2);

}catch(e){

console.log(e);

}

}

setInterval(price,2000);

function buyTrade(){

if(position!=null){

alert("يوجد صفقة مفتوحة");

return;

}

position="BUY";

entry=current;

document.getElementById("trade").innerHTML =
"🟢 BUY @ "+entry.toFixed(2);

}

function sellTrade(){

if(position!=null){

alert("يوجد صفقة مفتوحة");

return;

}

position="SELL";

entry=current;

document.getElementById("trade").innerHTML =
"🔴 SELL @ "+entry.toFixed(2);

}

function closeTrade(){

if(position==null){

alert("لا توجد صفقة");

return;

}

balance += profit;

document.getElementById("balance").innerHTML =
balance.toFixed(2);

alert("تم إغلاق الصفقة");

position=null;

profit=0;

document.getElementById("profit").innerHTML="0";

document.getElementById("trade").innerHTML=
"لا يوجد";

}

</script>

</body>
</html>
