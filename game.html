<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>حرب عالمية ثانية</title>

<style>

body{
margin:0;
overflow:hidden;
background:#111;
font-family:Arial;
}

canvas{
display:block;
background:#2e4d24;
}

#ui{
position:absolute;
top:10px;
right:10px;
color:white;
font-size:22px;
background:rgba(0,0,0,0.5);
padding:10px;
border-radius:10px;
}

#start{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
padding:20px 40px;
font-size:26px;
background:red;
color:white;
border:none;
border-radius:12px;
}

</style>
</head>

<body>

<div id="ui">
النقاط: <span id="score">0</span>
</div>

<button id="start">
ابدأ الحرب
</button>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let gameStarted = false;

let score = 0;

const player = {
x: canvas.width/2,
y: canvas.height-140,
w: 70,
h: 70,
speed: 8
};

let bullets = [];
let enemies = [];

function drawBackground(){

ctx.fillStyle = "#3d5f2d";
ctx.fillRect(0,0,canvas.width,canvas.height);

for(let i=0;i<canvas.width;i+=100){

ctx.fillStyle = "#4f772d";

ctx.fillRect(i,0,50,canvas.height);

}

}

function drawPlayer(){

ctx.fillStyle = "#00c2ff";

ctx.fillRect(player.x,player.y,player.w,player.h);

ctx.fillStyle = "#222";

ctx.fillRect(player.x+20,player.y-10,30,20);

ctx.fillStyle = "white";

ctx.fillRect(player.x+10,player.y+15,10,10);

ctx.fillRect(player.x+50,player.y+15,10,10);

}

function drawBullets(){

bullets.forEach((bullet,index)=>{

ctx.fillStyle = "yellow";

ctx.fillRect(bullet.x,bullet.y,8,25);

bullet.y -= 12;

if(bullet.y < 0){

bullets.splice(index,1);

}

});

}

function drawEnemies(){

enemies.forEach((enemy,eIndex)=>{

ctx.fillStyle = "darkred";

ctx.fillRect(enemy.x,enemy.y,enemy.w,enemy.h);

ctx.fillStyle = "black";

ctx.fillRect(enemy.x+20,enemy.y+15,20,20);

ctx.fillRect(enemy.x+10,enemy.y-8,40,12);

enemy.y += enemy.speed;

if(enemy.y > canvas.height){

alert("انتهت الحرب! نقاطك: " + score);

location.reload();

}

bullets.forEach((bullet,bIndex)=>{

if(

bullet.x < enemy.x + enemy.w &&
bullet.x + 8 > enemy.x &&
bullet.y < enemy.y + enemy.h &&
bullet.y + 25 > enemy.y

){

score++;

document.getElementById("score").innerHTML = score;

enemies.splice(eIndex,1);

bullets.splice(bIndex,1);

}

});

});

}

function spawnEnemies(){

setInterval(()=>{

if(gameStarted){

enemies.push({

x: Math.random() * (canvas.width - 70),
y: -100,
w: 70,
h: 70,
speed: 2 + Math.random()*3

});

}

},1000);

}

function gameLoop(){

ctx.clearRect(0,0,canvas.width,canvas.height);

drawBackground();

drawPlayer();

drawBullets();

drawEnemies();

requestAnimationFrame(gameLoop);

}

window.addEventListener("mousemove",(e)=>{

player.x = e.clientX - 35;

});

window.addEventListener("touchmove",(e)=>{

player.x = e.touches[0].clientX - 35;

});

window.addEventListener("click",()=>{

bullets.push({

x: player.x + 30,
y: player.y

});

});

window.addEventListener("touchstart",()=>{

bullets.push({

x: player.x + 30,
y: player.y

});

});

document.getElementById("start").onclick = ()=>{

gameStarted = true;

document.getElementById("start").style.display = "none";

spawnEnemies();

gameLoop();

};

</script>

</body>
</html>
