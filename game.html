<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mini PUBG</title>

<style>

body{
margin:0;
overflow:hidden;
background:#222;
}

canvas{
display:block;
background:#567d46;
}

#score{
position:absolute;
top:10px;
left:10px;
color:white;
font-size:24px;
background:black;
padding:10px;
border-radius:10px;
}

#shoot{
position:absolute;
bottom:40px;
right:30px;
width:80px;
height:80px;
border-radius:50%;
background:red;
color:white;
font-size:25px;
border:none;
}

</style>
</head>

<body>

<div id="score">
النقاط: 0
</div>

<button id="shoot">
🔥
</button>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let score = 0;

const player = {
x:200,
y:400,
size:40,
speed:5
};

let bullets = [];
let enemies = [];

function map(){

ctx.fillStyle="#567d46";
ctx.fillRect(0,0,canvas.width,canvas.height);

for(let i=0;i<canvas.width;i+=100){

ctx.fillStyle="#4b6b3f";

ctx.fillRect(i,0,50,canvas.height);

}

}

function drawPlayer(){

ctx.fillStyle="#00bfff";

ctx.beginPath();

ctx.arc(player.x,player.y,25,0,Math.PI*2);

ctx.fill();

ctx.fillStyle="black";

ctx.fillRect(player.x-5,player.y-35,10,25);

}

function drawBullets(){

bullets.forEach((b,index)=>{

ctx.fillStyle="yellow";

ctx.fillRect(b.x,b.y,6,18);

b.y -= 10;

if(b.y < 0){

bullets.splice(index,1);

}

});

}

function createEnemy(){

enemies.push({

x:Math.random()*canvas.width,
y:-50,
size:35,
speed:2+Math.random()*2

});

}

setInterval(createEnemy,1200);

function drawEnemies(){

enemies.forEach((e,eIndex)=>{

ctx.fillStyle="red";

ctx.beginPath();

ctx.arc(e.x,e.y,25,0,Math.PI*2);

ctx.fill();

ctx.fillStyle="black";

ctx.fillRect(e.x-5,e.y-35,10,25);

e.y += e.speed;

if(

e.x < player.x+25 &&
e.x+25 > player.x-25 &&
e.y < player.y+25 &&
e.y+25 > player.y-25

){

alert("انتهت اللعبة");

location.reload();

}

bullets.forEach((b,bIndex)=>{

if(

b.x < e.x+25 &&
b.x+6 > e.x-25 &&
b.y < e.y+25 &&
b.y+18 > e.y-25

){

score++;

document.getElementById("score").innerHTML =
"النقاط: " + score;

enemies.splice(eIndex,1);

bullets.splice(bIndex,1);

}

});

});

}

function game(){

ctx.clearRect(0,0,canvas.width,canvas.height);

map();

drawPlayer();

drawBullets();

drawEnemies();

requestAnimationFrame(game);

}

game();

document.getElementById("shoot").onclick=()=>{

bullets.push({

x:player.x,
y:player.y

});

};

window.addEventListener("touchmove",(e)=>{

player.x = e.touches[0].clientX;
player.y = e.touches[0].clientY;

});

</script>

</body>
</html>
