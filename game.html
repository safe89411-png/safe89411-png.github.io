<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mini PUBG</title>

<style>

body{
margin:0;
overflow:hidden;
background:#222;
}

canvas{
display:block;
background:#4c7a34;
touch-action:none;
}

#info{
position:absolute;
top:10px;
left:10px;
color:white;
font-size:22px;
background:rgba(0,0,0,0.5);
padding:10px;
border-radius:10px;
z-index:10;
}

</style>
</head>

<body>

<div id="info">
النقاط: <span id="score">0</span>
</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let keys = {};
let bullets = [];
let enemies = [];
let score = 0;

const player = {
x: canvas.width/2,
y: canvas.height/2,
size: 40,
speed: 5,
color: "#00bfff"
};

function drawMap(){

ctx.fillStyle = "#4c7a34";
ctx.fillRect(0,0,canvas.width,canvas.height);

for(let i=0;i<30;i++){

ctx.fillStyle = "#3d5f2d";

ctx.fillRect(i*80,0,40,canvas.height);

}

}

function drawPlayer(){

ctx.fillStyle = player.color;

ctx.fillRect(player.x,player.y,player.size,player.size);

ctx.fillStyle = "black";

ctx.fillRect(player.x+10,player.y-8,20,10);

}

function movePlayer(){

if(keys["w"]) player.y -= player.speed;
if(keys["s"]) player.y += player.speed;
if(keys["a"]) player.x -= player.speed;
if(keys["d"]) player.x += player.speed;

if(player.x < 0) player.x = 0;
if(player.y < 0) player.y = 0;

if(player.x > canvas.width-player.size)
player.x = canvas.width-player.size;

if(player.y > canvas.height-player.size)
player.y = canvas.height-player.size;

}

function shoot(){

bullets.push({
x: player.x + 18,
y: player.y
});

}

function drawBullets(){

bullets.forEach((b,index)=>{

ctx.fillStyle = "yellow";

ctx.fillRect(b.x,b.y,5,15);

b.y -= 10;

if(b.y < 0){
bullets.splice(index,1);
}

});

}

function spawnEnemies(){

setInterval(()=>{

enemies.push({

x: Math.random() * (canvas.width-40),
y: -50,
size:40,
speed:2 + Math.random()*2

});

},1000);

}

function drawEnemies(){

enemies.forEach((e,eIndex)=>{

ctx.fillStyle = "red";

ctx.fillRect(e.x,e.y,e.size,e.size);

ctx.fillStyle = "black";

ctx.fillRect(e.x+10,e.y-8,20,10);

e.y += e.speed;

if(
e.x < player.x + player.size &&
e.x + e.size > player.x &&
e.y < player.y + player.size &&
e.y + e.size > player.y
){

alert("انتهت اللعبة! نقاطك: " + score);

location.reload();

}

bullets.forEach((b,bIndex)=>{

if(

b.x < e.x + e.size &&
b.x + 5 > e.x &&
b.y < e.y + e.size &&
b.y + 15 > e.y

){

score++;

document.getElementById("score").innerHTML = score;

enemies.splice(eIndex,1);

bullets.splice(bIndex,1);

}

});

});

}

function gameLoop(){

ctx.clearRect(0,0,canvas.width,canvas.height);

drawMap();

movePlayer();

drawPlayer();

drawBullets();

drawEnemies();

requestAnimationFrame(gameLoop);

}

window.addEventListener("keydown",(e)=>{

keys[e.key.toLowerCase()] = true;

});

window.addEventListener("keyup",(e)=>{

keys[e.key.toLowerCase()] = false;

});

window.addEventListener("click",shoot);

window.addEventListener("touchstart",shoot);

window.addEventListener("touchmove",(e)=>{

player.x = e.touches[0].clientX - 20;
player.y = e.touches[0].clientY - 20;

});

spawnEnemies();

gameLoop();

</script>

</body>
</html>
