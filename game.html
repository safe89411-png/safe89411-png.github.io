<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Battle Game</title>

<style>

body{
margin:0;
overflow:hidden;
background:#222;
font-family:Arial;
}

#game{
position:relative;
width:100vw;
height:100vh;
background:url('https://i.imgur.com/eJdKXG5.jpeg');
background-size:cover;
overflow:hidden;
}

#player{
position:absolute;
width:60px;
height:60px;
background:url('https://i.imgur.com/7kCeFQK.png');
background-size:cover;
left:45%;
top:70%;
}

.enemy{
position:absolute;
width:60px;
height:60px;
background:url('https://i.imgur.com/2RMz7uX.png');
background-size:cover;
}

.bullet{
position:absolute;
width:8px;
height:20px;
background:yellow;
}

#shoot{
position:absolute;
bottom:40px;
right:30px;
width:90px;
height:90px;
border-radius:50%;
background:red;
color:white;
font-size:30px;
border:none;
z-index:10;
}

#score{
position:absolute;
top:10px;
left:10px;
background:black;
color:white;
padding:10px;
border-radius:10px;
font-size:22px;
z-index:10;
}

</style>
</head>

<body>

<div id="game">

<div id="score">
النقاط: 0
</div>

<div id="player"></div>

<button id="shoot">
🔥
</button>

</div>

<script>

const game = document.getElementById("game");
const player = document.getElementById("player");

let score = 0;
let bullets = [];

let px = window.innerWidth/2;
let py = window.innerHeight-200;

function movePlayer(x,y){

px = x-30;
py = y-30;

player.style.left = px + "px";
player.style.top = py + "px";

}

window.addEventListener("touchmove",(e)=>{

movePlayer(
e.touches[0].clientX,
e.touches[0].clientY
);

});

window.addEventListener("mousemove",(e)=>{

movePlayer(
e.clientX,
e.clientY
);

});

document.getElementById("shoot").onclick=()=>{

const bullet = document.createElement("div");

bullet.className = "bullet";

bullet.style.left = (px+25)+"px";
bullet.style.top = py+"px";

game.appendChild(bullet);

let bulletMove = setInterval(()=>{

bullet.style.top =
(bullet.offsetTop - 12)+"px";

document.querySelectorAll(".enemy").forEach(enemy=>{

if(

bullet.offsetLeft < enemy.offsetLeft + 60 &&
bullet.offsetLeft + 8 > enemy.offsetLeft &&
bullet.offsetTop < enemy.offsetTop + 60 &&
bullet.offsetTop + 20 > enemy.offsetTop

){

enemy.remove();
bullet.remove();

score++;

document.getElementById("score")
.innerHTML = "النقاط: " + score;

}

});

if(bullet.offsetTop < 0){

bullet.remove();

clearInterval(bulletMove);

}

},20);

};

function spawnEnemy(){

const enemy = document.createElement("div");

enemy.className = "enemy";

enemy.style.left =
Math.random() * (window.innerWidth-60)+"px";

enemy.style.top = "-60px";

game.appendChild(enemy);

let move = setInterval(()=>{

enemy.style.top =
(enemy.offsetTop + 3)+"px";

if(

enemy.offsetLeft < px + 60 &&
enemy.offsetLeft + 60 > px &&
enemy.offsetTop < py + 60 &&
enemy.offsetTop + 60 > py

){

alert("انتهت اللعبة");

location.reload();

}

if(enemy.offsetTop > window.innerHeight){

enemy.remove();

clearInterval(move);

}

},30);

}

setInterval(spawnEnemy,1200);

</script>

</body>
</html>
