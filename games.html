<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مدينة القديمة</title>

<style>

body{
margin:0;
font-family:Arial;
background:#d8c28c;
text-align:center;
direction:rtl;
}

header{
background:#5b3a1a;
color:white;
padding:20px;
font-size:40px;
font-weight:bold;
}

.top{
display:flex;
justify-content:space-around;
padding:15px;
background:white;
font-size:25px;
font-weight:bold;
box-shadow:0 0 10px rgba(0,0,0,0.3);
}

.city{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
padding:20px;
}

.building{
background:white;
border-radius:20px;
padding:15px;
box-shadow:0 0 15px rgba(0,0,0,0.2);
}

.building img{
width:100px;
height:100px;
}

button{
background:#00c853;
color:white;
border:none;
padding:12px 20px;
font-size:20px;
border-radius:15px;
margin-top:10px;
}

button:hover{
background:#009624;
}

.menu{
margin:20px;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.card{
background:white;
padding:20px;
border-radius:20px;
font-size:25px;
font-weight:bold;
box-shadow:0 0 15px rgba(0,0,0,0.2);
}

footer{
margin-top:30px;
padding:20px;
background:#5b3a1a;
color:white;
font-size:20px;
}

</style>
</head>

<body>

<header>
🏰 المدينة القديمة
</header>

<div class="top">
<div>💰 الذهب: <span id="gold">500</span></div>
<div>👥 السكان: <span id="people">0</span></div>
<div>🛡 الجيش: <span id="army">0</span></div>
</div>

<div class="city">

<div class="building">
<img src="https://cdn-icons-png.flaticon.com/512/619/619153.png">
<h2>بيت</h2>
<p>يزيد السكان</p>
<button onclick="buyHouse()">بناء</button>
</div>

<div class="building">
<img src="https://cdn-icons-png.flaticon.com/512/3081/3081559.png">
<h2>محل</h2>
<p>يعطي ذهب كل دقيقة</p>
<button onclick="buyShop()">بناء</button>
</div>

<div class="building">
<img src="https://cdn-icons-png.flaticon.com/512/1048/1048941.png">
<h2>ثكنة</h2>
<p>إضافة جنود</p>
<button onclick="buyArmy()">بناء</button>
</div>

</div>

<div class="menu">

<div class="card" onclick="dailyReward()">
🎁 مكافأة يومية
</div>

<div class="card" onclick="spinWheel()">
🎡 عجلة الحظ
</div>

<div class="card">
🏆 المهام اليومية
</div>

<div class="card">
💳 سحب النقاط
</div>

<div class="card">
🛒 متجر اللعبة
</div>

<div class="card">
👑 VIP
</div>

</div>

<script>

let gold = 500;
let people = 0;
let army = 0;

function update(){

document.getElementById("gold").innerHTML = gold;
document.getElementById("people").innerHTML = people;
document.getElementById("army").innerHTML = army;

localStorage.setItem("gold", gold);
localStorage.setItem("people", people);
localStorage.setItem("army", army);

}

function loadGame(){

gold = parseInt(localStorage.getItem("gold")) || 500;
people = parseInt(localStorage.getItem("people")) || 0;
army = parseInt(localStorage.getItem("army")) || 0;

update();

}

function buyHouse(){

if(gold >= 100){

gold -= 100;
people += 5;

alert("✅ تم بناء بيت");

update();

}else{

alert("❌ لا يوجد ذهب كافي");

}

}

function buyShop(){

if(gold >= 150){

gold -= 150;

alert("🏪 تم بناء محل");

update();

}else{

alert("❌ لا يوجد ذهب كافي");

}

}

function buyArmy(){

if(gold >= 200){

gold -= 200;
army += 10;

alert("🛡 تم تدريب جنود");

update();

}else{

alert("❌ لا يوجد ذهب كافي");

}

}

function dailyReward(){

gold += 100;

alert("🎁 حصلت على 100 ذهب");

update();

}

function spinWheel(){

let reward = Math.floor(Math.random() * 500);

gold += reward;

alert("🎡 ربحت " + reward + " ذهب");

update();

}

setInterval(function(){

gold += 5;
update();

},60000);

loadGame();

</script>

<footer>
MG GAME ©
</footer>

</body>
</html>
