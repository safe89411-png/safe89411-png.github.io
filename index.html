<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
تطبيقي العالمي
</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#1d35ff;
direction:rtl;
color:white;
}

#menu{
padding:25px;
}

.card{
background:#4964ff;
padding:50px;
margin:25px;
border-radius:40px;
font-size:55px;
font-weight:bold;
text-align:center;
box-shadow:0 0 25px #00000055;
}

.page{
display:none;
padding:20px;
}

.box{
background:#1f2937;
padding:25px;
border-radius:35px;
margin-top:20px;
}

.signalBox{
background:black;
padding:30px;
border-radius:35px;
text-align:center;
margin-bottom:20px;
}

.signal{
font-size:70px;
font-weight:bold;
}

.buy{
color:#00ff88;
}

.sell{
color:#ff4444;
}

.hold{
color:gold;
}

.stats{
font-size:32px;
line-height:2;
}

button{
padding:20px 35px;
font-size:30px;
border:none;
border-radius:20px;
margin-top:20px;
background:#00aa55;
color:white;
}

.back{
background:red;
}

.ad{
background:white;
color:black;
padding:30px;
font-size:40px;
border-radius:25px;
text-align:center;
margin-top:20px;
font-weight:bold;
}

</style>

</head>

<body>

<div id="menu">

<div class="card"
onclick="openPage('trade')">

📈 التداول

</div>

<div class="card">

🎮 اللعبة

</div>

<div class="card">

📚 المقالات

</div>

<div class="card">

🎥 الفيديوهات

</div>

</div>

<div class="page"
id="trade">

<div class="box">

<div class="signalBox">

<div id="signal"
class="signal hold">

HOLD

</div>

<div id="signalText"
style="font-size:35px;">

انتظار التحليل

</div>

</div>

<div id="tradingview_chart"
style="height:500px;">
</div>

<button onclick="analyzeMarket()">

تحليل السوق

</button>

</div>

<div class="box stats">

💰 الربح:
<span id="profit">

0

</span>$

<br><br>

❌ الخسارة:
<span id="loss">

0

</span>$

<br><br>

📊 النتيجة:
<span id="result">

0

</span>$

<br><br>

✅ الصفقات الرابحة:
<span id="wins">

0

</span>

<br><br>

❌ الصفقات الخاسرة:
<span id="losses">

0

</span>

</div>

<div class="ad">

💰 إعلان تداول

</div>

<button class="back"
onclick="backHome()">

رجوع

</button>

</div>

<script>

function openPage(id){

document.getElementById(
"menu"
).style.display="none";

let pages =
document.querySelectorAll(".page");

pages.forEach(p=>{
p.style.display="none";
});

document.getElementById(id)
.style.display="block";

}

function backHome(){

let pages =
document.querySelectorAll(".page");

pages.forEach(p=>{
p.style.display="none";
});

document.getElementById(
"menu"
).style.display="block";

}

new TradingView.widget({

"width":"100%",

"height":500,

"symbol":"OANDA:XAUUSD",

"interval":"5",

"timezone":"Asia/Baghdad",

"theme":"dark",

"style":"1",

"locale":"ar",

"toolbar_bg":"#111827",

"enable_publishing":false,

"allow_symbol_change":true,

"container_id":"tradingview_chart"

});

let lastPrice = 0;

let totalProfit = 0;

let totalLoss = 0;

let wins = 0;

let losses = 0;

async function analyzeMarket(){

try{

const response =
await fetch(
"https://api.gold-api.com/price/XAU"
);

const data =
await response.json();

let price =
data.price;

let signal = "";

let floating = (
Math.random()*5
).toFixed(2);

if(lastPrice == 0){

lastPrice = price;

}

if(price > lastPrice){

signal = "BUY";

document.getElementById(
"signal"
).className =

"signal buy";

document.getElementById(
"signal"
).innerHTML =

"BUY";

document.getElementById(
"signalText"
).innerHTML =

"🟢 شراء الذهب";

totalProfit +=
parseFloat(floating);

wins++;

}

else if(price < lastPrice){

signal = "SELL";

document.getElementById(
"signal"
).className =

"signal sell";

document.getElementById(
"signal"
).innerHTML =

"SELL";

document.getElementById(
"signalText"
).innerHTML =

"🔴 بيع الذهب";

totalLoss +=
parseFloat(floating);

losses++;

}

else{

document.getElementById(
"signal"
).className =

"signal hold";

document.getElementById(
"signal"
).innerHTML =

"HOLD";

document.getElementById(
"signalText"
).innerHTML =

"🟡 انتظار";

}

lastPrice = price;

document.getElementById(
"profit"
).innerHTML =

totalProfit.toFixed(2);

document.getElementById(
"loss"
).innerHTML =

totalLoss.toFixed(2);

document.getElementById(
"result"
).innerHTML =

(
totalProfit-totalLoss
).toFixed(2);

document.getElementById(
"wins"
).innerHTML = wins;

document.getElementById(
"losses"
).innerHTML = losses;

}

catch(e){

alert("فشل الاتصال بالسوق");

}

}

</script>

</body>

</html>
