<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>المهام</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
padding:20px;
}

.points{
background:#222;
padding:20px;
border-radius:15px;
text-align:center;
font-size:28px;
margin-bottom:20px;
}

.task{
background:#222;
padding:20px;
border-radius:15px;
margin-bottom:20px;
}

button{
width:100%;
padding:15px;
background:#00aa66;
border:none;
border-radius:10px;
color:white;
font-size:20px;
}

#message{
position:fixed;
bottom:20px;
left:20px;
right:20px;
background:#00aa66;
padding:15px;
border-radius:10px;
text-align:center;
font-size:20px;
display:none;
}

.timer{
font-size:22px;
margin-top:10px;
text-align:center;
}

</style>

</head>

<body>

<div class="points">
💰 نقاطك:
<span id="points">50</span>
</div>

<h1>
🏆 المهام اليومية
</h1>

<div class="task">

<h2>
📺 مشاهدة إعلان كامل
</h2>

<p>
شاهد 15 ثانية لتحصل على 10 نقاط
</p>

<button onclick="watchAd()">
ابدأ الإعلان
</button>

<div class="timer" id="adTimer"></div>

</div>

<div class="task">

<h2>
🎮 تجربة لعبة
</h2>

<p>
العب 20 ثانية لتحصل على 20 نقطة
</p>

<button onclick="playGame()">
تشغيل اللعبة
</button>

<div class="timer" id="gameTimer"></div>

</div>

<div id="message"></div>

<script>

let points = localStorage.getItem("points");

if(points == null){
points = 50;
}

document.getElementById("points").innerText = points;

function showMessage(text){

let msg = document.getElementById("message");

msg.innerText = text;

msg.style.display = "block";

setTimeout(() => {
msg.style.display = "none";
},3000);

}

function watchAd(){

let time = 15;

document.getElementById("adTimer").innerText =
"⏳ انتظر " + time + " ثانية";

let counter = setInterval(() => {

time--;

document.getElementById("adTimer").innerText =
"⏳ انتظر " + time + " ثانية";

if(time <= 0){

clearInterval(counter);

points = parseInt(points) + 10;

localStorage.setItem("points", points);

document.getElementById("points").innerText = points;

document.getElementById("adTimer").innerText =
"✅ اكتملت المهمة";

showMessage("تم إضافة 10 نقاط 🎉");

}

},1000);

}

function playGame(){

window.open(
"https://play.google.com/store/apps/details?id=com.tencent.ig"
);

let time = 20;

document.getElementById("gameTimer").innerText =
"⏳ العب " + time + " ثانية";

let counter = setInterval(() => {

time--;

document.getElementById("gameTimer").innerText =
"⏳ العب " + time + " ثانية";

if(time <= 0){

clearInterval(counter);

points = parseInt(points) + 20;

localStorage.setItem("points", points);

document.getElementById("points").innerText = points;

document.getElementById("gameTimer").innerText =
"✅ تم احتساب المكافأة";

showMessage("تم إضافة 20 نقطة 🎮");

}

},1000);

}

</script>

</body>
</html>
