<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<title>المهام</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
padding:20px;
}

.points{
background:#222;
padding:20px;
border-radius:15px;
text-align:center;
font-size:25px;
margin-bottom:20px;
}

.task{
background:#222;
padding:20px;
border-radius:15px;
margin-bottom:20px;
}

button{
width:100%;
padding:15px;
background:#00aa66;
border:none;
border-radius:10px;
color:white;
font-size:18px;
}

</style>

</head>

<body>

<div class="points">
💰 نقاطك: <span id="points">1200</span>
</div>

<h1>
🏆 المهام
</h1>

<div class="task">

<h2>
📺 مشاهدة إعلان
</h2>

<p>
+10 نقاط
</p>

<button onclick="addPoints(10)">
ابدأ المهمة
</button>

</div>

<div class="task">

<h2>
🎮 تجربة لعبة
</h2>

<p>
+20 نقاط
</p>

<button onclick="addPoints(20)">
ابدأ المهمة
</button>

</div>

<script>

let points = 1200;

function addPoints(amount){

points += amount;

document.getElementById("points").innerText = points;

alert("تم إضافة " + amount + " نقطة");

}

</script>

</body>
</html>
