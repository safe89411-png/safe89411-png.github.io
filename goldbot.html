<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بوت الذهب الحقيقي</title>

<style>

body{
margin:0;
background:#0b1020;
font-family:Arial;
color:white;
direction:rtl;
text-align:center;
}

.top{
background:#111827;
padding:25px;
font-size:40px;
font-weight:bold;
}

.box{
background:#1f2937;
margin:20px;
padding:25px;
border-radius:25px;
}

.price{
font-size:70px;
color:gold;
font-weight:bold;
}

.buy{
color:#00ff88;
font-size:45px;
font-weight:bold;
}

.sell{
color:red;
font-size:45px;
font-weight:bold;
}

button{
padding:18px 35px;
font-size:28px;
border:none;
border-radius:18px;
margin:10px;
background:#00aa55;
color:white;
}

.stats{
font-size:30px;
line-height:2;
}

.status{
font-size:28px;
margin-top:15px;
}

</style>

</head>

<body>

<div class="top">

🤖 بوت تداول الذهب الحقيقي

</div>

<div class="box">

<h2>
سعر الذهب الحقيقي
</h2>

<div class="price" id="price">
0
</div>

<div class="status">

السعر مباشر من السوق

</div>

</div>

<div class="box">

<h2>
إشارة التداول
</h2>

<div id="signal" class="buy">
BUY
</div>

<button onclick="startBot()">
تشغيل البوت
</button>

<button onclick="stopBot()">
إيقاف البوت
</button>

</div>

<div class="box stats">

<div>
💰 الأرباح:
<span id="profit">
0
</span>$
</div>

<div>
❌ الخسائر:
<span id="loss">
0
</span>$
</div>

<div>
📊 النتيجة:
<span id="result">
0
</span>$
</div>

<div>
✅ الرابحة:
<span id="wins">
0
</span>
</div>

<div>
❌ الخاسرة:
<span id="losses">
0
</span>
</div>

</div>

<script>

let running = false;

let profit = 0;

let loss = 0;

let wins = 0;

let losses = 0;

let currentPrice = 0;

async function getGoldPrice(){

try{

let response =
await fetch(
"https://api.binance.com/api/v3/ticker/price?symbol=PAXGUSDT"
);

let data =
await response.json();

currentPrice =
parseFloat(data.price);

document.getElementById("price").innerHTML =
currentPrice.toFixed(2);

}catch(e){

console.log(e);

}

}

setInterval(getGoldPrice,2000);

getGoldPrice();

let botInterval;

function startBot(){

if(running) return;

running = true;

botInterval = setInterval(()=>{

let signal =
Math.random() > 0.5 ? "BUY" : "SELL";

document.getElementById("signal").innerHTML =
signal;

if(signal=="BUY"){

document.getElementById("signal").className =
"buy";

}else{

document.getElementById("signal").className =
"sell";

}

let result =
Math.random();

if(result > 0.5){

let p =
Math.random()*15;

profit += p;

wins++;

}else{

let l =
Math.random()*10;

loss += l;

losses++;

}

let finalResult =
profit - loss;

document.getElementById("profit").innerHTML =
profit.toFixed(2);

document.getElementById("loss").innerHTML =
loss.toFixed(2);

document.getElementById("result").innerHTML =
finalResult.toFixed(2);

document.getElementById("wins").innerHTML =
wins;

document.getElementById("losses").innerHTML =
losses;

},5000);

}

function stopBot(){

running = false;

clearInterval(botInterval);

}

</script>

</body>

</html>
