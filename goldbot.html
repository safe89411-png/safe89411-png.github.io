<script>

let capital = 750;

let profit = 0;

let loss = 0;

let result = 0;

let wins = 0;

let losses = 0;

let running = false;

let botInterval;

function startBot(){

if(running) return;

running = true;

document.getElementById(
"withdrawStatus"
).innerHTML =

"🟢 البوت يعمل الآن";

botInterval = setInterval(()=>{

let trade =
Math.random();

if(trade > 0.5){

let p =
Math.random()*20;

profit += p;

wins++;

}else{

let l =
Math.random()*15;

loss += l;

losses++;

}

result =
profit - loss;

document.getElementById(
"profit"
).innerHTML =
profit.toFixed(2);

document.getElementById(
"loss"
).innerHTML =
loss.toFixed(2);

document.getElementById(
"result"
).innerHTML =
result.toFixed(2);

document.getElementById(
"wins"
).innerHTML =
wins;

document.getElementById(
"losses"
).innerHTML =
losses;

},3000);

}

function stopBot(){

running = false;

clearInterval(botInterval);

let finalCapital =
capital + result;

document.getElementById(
"capital"
).innerHTML =

finalCapital.toFixed(2) + "$";

if(result >= 0){

document.getElementById(
"finalResult"
).innerHTML =

"+" + result.toFixed(2) + "$";

}else{

document.getElementById(
"finalResult"
).innerHTML =

result.toFixed(2) + "$";

}

document.getElementById(
"withdrawStatus"
).innerHTML =

"🔴 تم إيقاف البوت";

}

async function withdraw(){

let address =
document.getElementById(
"binanceid"
).value;

let amount =
document.getElementById(
"amount"
).value;

if(!address || !amount){

alert("املأ جميع الحقول");

return;

}

document.getElementById(
"withdrawStatus"
).innerHTML =

"⏳ جاري إرسال السحب الحقيقي...";

try{

let response = await fetch(

"http://127.0.0.1:5000/withdraw",

{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

address:address,

amount:amount

})

}

);

let data =
await response.json();

document.getElementById(
"withdrawStatus"
).innerHTML =

"✅ تم إرسال السحب";

alert(

JSON.stringify(data)

);

}catch(e){

document.getElementById(
"withdrawStatus"
).innerHTML =

"❌ فشل الاتصال بالسيرفر";

alert(
"ERROR: " + e
);

}

}

</script>
