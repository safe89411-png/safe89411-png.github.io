<!DOCTYPE html>
<html lang="ar">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بوت التداول</title>

<style>

body{
margin:0;
background:#0b1020;
font-family:Arial;
color:white;
text-align:center;
}

.top{
background:#111827;
padding:25px;
font-size:45px;
font-weight:bold;
}

.box{
background:#1f2937;
margin:25px;
padding:30px;
border-radius:30px;
box-shadow:0 0 20px #00000055;
}

.price{
font-size:70px;
color:gold;
margin-top:20px;
}

.buy{
color:#00ff99;
font-size:50px;
font-weight:bold;
}

.sell{
color:red;
font-size:50px;
font-weight:bold;
}

button{
background:#00aa55;
border:none;
padding:20px 50px;
font-size:35px;
color:white;
border-radius:20px;
margin-top:25px;
}

.stats{
font-size:35px;
line-height:2;
}

</style>

</head>

<body>

<div class="top">

🤖 بوت تداول الذهب XAUUSD

</div>

<div class="box">

<h2>
السعر الحالي
</h2>

<div class="price" id="gold">
2335.10
</div>

</div>

<div class="box">

<h2>
إشارة التداول
</h2>

<div id="signal" class="buy">
BUY
</div>

<button onclick="startBot()">

تشغيل البوت

</button>

</div>

<div class="box stats">

<div>
💰 الأرباح:
<span id="profit">
0
</span>$
</div>

<div>
❌ الخسائر:
<span id="loss">
0
</span>$
</div>

<div>
✅ الصفقات الرابحة:
<span id="wins">
0
</span>
</div>

<div>
❌ الصفقات الخاسرة:
<span id="losses">
0
</span>
</div>

</div>

<script>

let gold = 2335;

let profit = 0;

let loss = 0;

let wins = 0;

let losses = 0;

function startBot(){

setInterval(()=>{

gold += (Math.random()*8)-4;

document.getElementById("gold").innerHTML =
gold.toFixed(2);

let signal =
Math.random() > 0.5 ? "BUY" : "SELL";

document.getElementById("signal").innerHTML =
signal;

if(signal=="BUY"){

document.getElementById("signal").className =
"buy";

}else{

document.getElementById("signal").className =
"sell";

}

let result =
Math.random();

if(result > 0.5){

profit += Math.random()*15;

wins++;

}else{

loss += Math.random()*10;

losses++;

}

document.getElementById("profit").innerHTML =
profit.toFixed(2);

document.getElementById("loss").innerHTML =
loss.toFixed(2);

document.getElementById("wins").innerHTML =
wins;

document.getElementById("losses").innerHTML =
losses;

},3000);

}

</script>

</body>
</html>
