<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بوت تداول الذهب</title>

<style>

body{
background:#0b1020;
color:white;
font-family:Arial;
margin:0;
padding:0;
text-align:center;
}

.top{
background:#111827;
padding:20px;
font-size:30px;
font-weight:bold;
}

.box{
background:#1f2937;
margin:20px;
padding:20px;
border-radius:20px;
}

.price{
font-size:45px;
margin-top:20px;
color:gold;
}

.buy{
color:#00ff88;
font-size:30px;
}

.sell{
color:red;
font-size:30px;
}

.stats{
font-size:22px;
line-height:2;
}

button{
background:#00aa55;
border:none;
padding:18px 40px;
font-size:25px;
border-radius:20px;
color:white;
margin-top:20px;
}

</style>
</head>

<body>

<div class="top">
🤖 بوت تداول الذهب XAUUSD
</div>

<div class="box">

<h2>السعر الحالي</h2>

<div class="price" id="gold">
2335.20
</div>

</div>

<div class="box">

<h2>إشارة البوت</h2>

<div id="signal" class="buy">
BUY
</div>

<button onclick="startBot()">
تشغيل البوت
</button>

</div>

<div class="box stats">

<div>
💰 الأرباح:
<span id="profit">0</span>$
</div>

<div>
❌ الخسائر:
<span id="loss">0</span>$
</div>

<div>
✅ الصفقات الرابحة:
<span id="wins">0</span>
</div>

<div>
❌ الصفقات الخاسرة:
<span id="losses">0</span>
</div>

</div>

<script>

let price = 2335;

let profit = 0;
let loss = 0;

let wins = 0;
let losses = 0;

function startBot(){

setInterval(()=>{

let move = (Math.random()*4)-2;

price += move;

document.getElementById("gold").innerHTML =
price.toFixed(2);

let signal =
Math.random() > 0.5 ? "BUY" : "SELL";

document.getElementById("signal").innerHTML =
signal;

if(signal=="BUY"){

document.getElementById("signal").className =
"buy";

}else{

document.getElementById("signal").className =
"sell";

}

let result =
Math.random();

if(result > 0.5){

profit += Math.random()*10;

wins++;

}else{

loss += Math.random()*5;

losses++;

}

document.getElementById("profit").innerHTML =
profit.toFixed(2);

document.getElementById("loss").innerHTML =
loss.toFixed(2);

document.getElementById("wins").innerHTML =
wins;

document.getElementById("losses").innerHTML =
losses;

},3000);

}

</script>

</body>
</html>
