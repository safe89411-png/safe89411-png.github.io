<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مدينة 3D</title>

<script src="https://cdn.babylonjs.com/babylon.js"></script>

<style>

html,body{
width:100%;
height:100%;
margin:0;
overflow:hidden;
background:#000;
}

#renderCanvas{
width:100%;
height:100%;
touch-action:none;
display:block;
}

#ui{
position:absolute;
top:10px;
left:10px;
z-index:10;
background:rgba(0,0,0,0.6);
padding:10px;
border-radius:15px;
color:white;
font-size:20px;
font-family:Arial;
}

button{
padding:10px;
border:none;
border-radius:10px;
margin-top:5px;
font-size:18px;
background:#00cc66;
color:white;
}

</style>
</head>

<body>

<div id="ui">

💰 الذهب:
<span id="gold">1000</span>

<br>

🏠 المنازل:
<span id="houses">0</span>

<br>

<button onclick="buildHouse()">
بناء منزل
</button>

</div>

<canvas id="renderCanvas"></canvas>

<script>

let gold = 1000;
let houses = 0;

const goldText =
document.getElementById("gold");

const housesText =
document.getElementById("houses");

const canvas =
document.getElementById("renderCanvas");

const engine =
new BABYLON.Engine(canvas,true);

const scene =
new BABYLON.Scene(engine);

scene.clearColor =
new BABYLON.Color3(0.5,0.8,1);

const camera =
new BABYLON.ArcRotateCamera(
"camera",
Math.PI/2,
1.2,
180,
new BABYLON.Vector3(0,0,0),
scene
);

camera.attachControl(canvas,true);

const light =
new BABYLON.HemisphericLight(
"light",
new BABYLON.Vector3(0,1,0),
scene
);

const ground =
BABYLON.MeshBuilder.CreateGround(
"ground",
{
width:400,
height:400
},
scene
);

const groundMat =
new BABYLON.StandardMaterial(
"groundMat",
scene
);

groundMat.diffuseColor =
new BABYLON.Color3(0.3,0.7,0.3);

ground.material = groundMat;

function createRoad(x,z,w,h){

let road =
BABYLON.MeshBuilder.CreateGround(
"road",
{
width:w,
height:h
},
scene
);

road.position.x = x;
road.position.z = z;
road.position.y = 0.02;

let roadMat =
new BABYLON.StandardMaterial(
"roadMat",
scene
);

roadMat.diffuseColor =
new BABYLON.Color3(0.2,0.2,0.2);

road.material = roadMat;

}

for(let i=-150;i<=150;i+=40){

createRoad(i,0,10,400);

}

for(let i=-150;i<=150;i+=40){

createRoad(0,i,400,10);

}

function createTree(x,z){

let trunk =
BABYLON.MeshBuilder.CreateCylinder(
"trunk",
{
diameter:1,
height:5
},
scene
);

trunk.position.x = x;
trunk.position.z = z;
trunk.position.y = 2;

let top =
BABYLON.MeshBuilder.CreateSphere(
"top",
{
diameter:5
},
scene
);

top.position.x = x;
top.position.z = z;
top.position.y = 6;

let topMat =
new BABYLON.StandardMaterial(
"topMat",
scene
);

topMat.diffuseColor =
new BABYLON.Color3(0,0.8,0);

top.material = topMat;

}

for(let i=0;i<100;i++){

createTree(
Math.random()*350-175,
Math.random()*350-175
);

}

function createBuilding(x,z){

let height =
Math.random()*30+10;

let building =
BABYLON.MeshBuilder.CreateBox(
"building",
{
width:12,
depth:12,
height:height
},
scene
);

building.position.x = x;
building.position.z = z;
building.position.y = height/2;

let mat =
new BABYLON.StandardMaterial(
"mat",
scene
);

mat.diffuseColor =
new BABYLON.Color3(
Math.random(),
Math.random(),
Math.random()
);

building.material = mat;

}

for(let x=-120;x<=120;x+=25){

for(let z=-120;z<=120;z+=25){

if(Math.random()>0.4){

createBuilding(x,z);

}

}

}

let cars = [];

function createCar(){

let car =
BABYLON.MeshBuilder.CreateBox(
"car",
{
width:5,
height:2,
depth:3
},
scene
);

car.position.y = 1;

car.position.x =
Math.random()*300-150;

car.position.z =
Math.random()*300-150;

let carMat =
new BABYLON.StandardMaterial(
"carMat",
scene
);

carMat.diffuseColor =
new BABYLON.Color3(
Math.random(),
Math.random(),
Math.random()
);

car.material = carMat;

cars.push(car);

}

for(let i=0;i<10;i++){

createCar();

}

scene.registerBeforeRender(function(){

cars.forEach(car=>{

car.position.x += 0.2;

if(car.position.x > 180){

car.position.x = -180;

}

});

});

function buildHouse(){

if(gold < 100){

alert("لا يوجد ذهب");

return;

}

gold -= 100;

houses++;

goldText.innerText = gold;

housesText.innerText = houses;

let x =
Math.random()*200-100;

let z =
Math.random()*200-100;

let house =
BABYLON.MeshBuilder.CreateBox(
"house",
{
width:10,
depth:10,
height:10
},
scene
);

house.position.x = x;

house.position.z = z;

house.position.y = 5;

let mat =
new BABYLON.StandardMaterial(
"mat",
scene
);

mat.diffuseColor =
new BABYLON.Color3(
0.8,
0.5,
0.3
);

house.material = mat;

localStorage.setItem(
"gold",
gold
);

localStorage.setItem(
"houses",
houses
);

}

if(localStorage.getItem("gold")){

gold =
parseInt(
localStorage.getItem("gold")
);

goldText.innerText = gold;

}

if(localStorage.getItem("houses")){

houses =
parseInt(
localStorage.getItem("houses")
);

housesText.innerText = houses;

}

engine.runRenderLoop(function(){

scene.render();

});

window.addEventListener(
"resize",
function(){

engine.resize();

});

</script>

</body>
</html>
