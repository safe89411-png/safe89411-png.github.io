<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>المدينة القديمة</title>

<script src="https://cdn.babylonjs.com/babylon.js"></script>

<style>

html,body{
width:100%;
height:100%;
margin:0;
overflow:hidden;
}

#renderCanvas{
width:100%;
height:100%;
touch-action:none;
}

</style>

</head>

<body>

<canvas id="renderCanvas"></canvas>

<script>

const canvas =
document.getElementById("renderCanvas");

const engine =
new BABYLON.Engine(canvas,true);

const createScene = function(){

const scene =
new BABYLON.Scene(engine);

scene.clearColor =
new BABYLON.Color3(0.5,0.8,1);

const camera =
new BABYLON.ArcRotateCamera(
"camera",
Math.PI/2,
Math.PI/3,
60,
new BABYLON.Vector3(0,0,0),
scene
);

camera.attachControl(canvas,true);

const light =
new BABYLON.HemisphericLight(
"light",
new BABYLON.Vector3(0,1,0),
scene
);

const ground =
BABYLON.MeshBuilder.CreateGround(
"ground",
{
width:100,
height:100
},
scene
);

const groundMat =
new BABYLON.StandardMaterial(
"groundMat",
scene
);

groundMat.diffuseColor =
new BABYLON.Color3(0.4,0.8,0.4);

ground.material = groundMat;

for(let i=0;i<20;i++){

let house =
BABYLON.MeshBuilder.CreateBox(
"house",
{
size:4
},
scene
);

house.position.x =
Math.random()*80-40;

house.position.z =
Math.random()*80-40;

house.position.y = 2;

let mat =
new BABYLON.StandardMaterial(
"mat",
scene
);

mat.diffuseColor =
new BABYLON.Color3(
Math.random(),
Math.random(),
Math.random()
);

house.material = mat;

}

for(let i=0;i<30;i++){

let tree =
BABYLON.MeshBuilder.CreateCylinder(
"tree",
{
diameter:1,
height:6
},
scene
);

tree.position.x =
Math.random()*90-45;

tree.position.z =
Math.random()*90-45;

tree.position.y = 3;

}

return scene;

};

const scene = createScene();

engine.runRenderLoop(function(){

scene.render();

});

window.addEventListener(
"resize",
function(){

engine.resize();

});

</script>

</body>
</html>
